<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} Weather</title>
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet" />
</head>

<body>

    <form action="/weather">
        <input type="text" name="city" id="city" placeholder="Enter a City" />
        <button type="submit">Submit</button>
    </form>


    <div class="Weather__title">
        <h1>{{ title }},{{country}} Weather</h1>
    </div>
    
    <div class="temperature__box">
        <p> {{ temp }} &deg;</p>
        <p> {{ status }} </p>
       


    </div>

    <div class="feel__like__box">
        <p>Feels like {{ feels_like }} &#8457;</p>
        <p>Humidity {{ humidity }} &#37;</p>
        <p> Wind {{ wind }} mph</p>
        <p>Pressure {{ pressure }} in</p>
    </div>






    
</body>

</html>
